<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠端喚醒控制台</title>
    <style>
        :root {
            --ink: #15181b;
            --panel: #f6f4ef;
            --panel-strong: #ece7dc;
            --line: #c8c0b2;
            --text: #20242a;
            --muted: #67727e;
            --accent: #0f766e;
            --accent-strong: #0b5f59;
            --warn: #b45309;
            --danger: #b42318;
            --success: #15803d;
            --shadow: 0 18px 50px rgba(21, 24, 27, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(90deg, rgba(21, 24, 27, 0.045) 1px, transparent 1px),
                linear-gradient(180deg, rgba(21, 24, 27, 0.045) 1px, transparent 1px),
                #d8d1c2;
            background-size: 28px 28px;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }

        main {
            width: min(1080px, calc(100% - 32px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            align-items: center;
            gap: 28px;
            padding: 32px 0;
        }

        .mast {
            color: #f9f3e7;
            background: var(--ink);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: var(--shadow);
            min-height: 560px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .mast::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 20%, rgba(20, 184, 166, 0.26), transparent 28%),
                linear-gradient(135deg, transparent 0 52%, rgba(245, 158, 11, 0.16) 52% 54%, transparent 54%);
            pointer-events: none;
        }

        .mast > * {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #facc15;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.4rem, 5vw, 4.8rem);
            line-height: 0.95;
            letter-spacing: 0;
        }

        .status-strip {
            display: grid;
            gap: 10px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-top: 1px solid rgba(249, 243, 231, 0.18);
            font-size: 0.95rem;
        }

        .status-row span:first-child {
            color: rgba(249, 243, 231, 0.64);
        }

        .workspace {
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            min-height: 560px;
            padding: 24px;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 18px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 16px;
        }

        .toolbar-title {
            font-size: 1rem;
            font-weight: 800;
        }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 0 10px;
            border: 1px solid var(--line);
            background: #fffaf0;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--warn);
        }

        .dot.connected {
            background: var(--success);
        }

        form, .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        label {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
        }

        input, select, button {
            min-height: 46px;
            border: 1px solid var(--line);
            border-radius: 0;
            font: inherit;
        }

        input, select {
            width: 100%;
            padding: 0 12px;
            color: var(--text);
            background: #fffaf0;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 118px;
            padding: 0 16px;
            color: white;
            background: var(--accent);
            border-color: var(--accent);
            font-weight: 850;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: var(--accent-strong);
        }

        button:disabled {
            cursor: not-allowed;
            background: #8b928f;
            border-color: #8b928f;
        }

        .hidden {
            display: none;
        }

        .console {
            min-height: 300px;
            background: #111416;
            color: #e8e0d2;
            border: 1px solid #111416;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .console-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(232, 224, 210, 0.18);
            color: #facc15;
            font-size: 0.8rem;
            font-weight: 850;
        }

        #message {
            margin: 0;
            padding: 14px;
            overflow-y: auto;
            max-height: 360px;
            min-height: 260px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.9rem;
            line-height: 1.55;
        }

        #message p {
            margin: 0 0 8px;
            white-space: pre-wrap;
        }

        #message p.error {
            color: #fca5a5;
        }

        #message p.success {
            color: #86efac;
        }

        @media (max-width: 760px) {
            main {
                grid-template-columns: 1fr;
                align-items: start;
                padding: 16px 0;
            }

            .mast, .workspace {
                min-height: auto;
            }

            .mast {
                padding: 22px;
            }

            form, .controls {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="mast" aria-label="遠端喚醒">
            <div>
                <p class="eyebrow">Wake-on-LAN</p>
                <h1>遠端喚醒控制台</h1>
            </div>
            <div class="status-strip">
                <div class="status-row">
                    <span>SESSION</span>
                    <strong id="session-status">LOCKED</strong>
                </div>
                <div class="status-row">
                    <span>SOCKET</span>
                    <strong id="socket-status-text">OFFLINE</strong>
                </div>
                <div class="status-row">
                    <span>JOB</span>
                    <strong id="job-status">IDLE</strong>
                </div>
            </div>
        </section>

        <section class="workspace" aria-label="控制面板">
            <div class="toolbar">
                <div class="toolbar-title">控制面板</div>
                <div class="connection" aria-live="polite">
                    <span id="socket-dot" class="dot"></span>
                    <span id="socket-label">未連線</span>
                </div>
            </div>

            <form id="login-form">
                <input type="text" name="username" autocomplete="username" class="hidden">
                <div class="field">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="submit-password">登入</button>
            </form>

            <div id="device-section" class="controls hidden">
                <div class="field">
                    <label for="device-select">裝置</label>
                    <select id="device-select"></select>
                </div>
                <button id="wakeup-button" type="button">喚醒</button>
            </div>

            <div class="console" aria-live="polite">
                <div class="console-head">
                    <span>EVENT LOG</span>
                    <span id="log-state">READY</span>
                </div>
                <div id="message"></div>
            </div>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const deviceSection = document.getElementById('device-section');
        const passwordInput = document.getElementById('password');
        const submitPasswordBtn = document.getElementById('submit-password');
        const deviceSelect = document.getElementById('device-select');
        const wakeupButton = document.getElementById('wakeup-button');
        const messageDiv = document.getElementById('message');
        const socketDot = document.getElementById('socket-dot');
        const socketLabel = document.getElementById('socket-label');
        const socketStatusText = document.getElementById('socket-status-text');
        const sessionStatus = document.getElementById('session-status');
        const jobStatus = document.getElementById('job-status');
        const logState = document.getElementById('log-state');

        let devices = [];
        let socket = null;
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let intentionalClose = false;
        let activeJobId = localStorage.getItem('wolActiveJobId') || '';

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitPasswordBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput.value })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    appendLog(data.message || '登入失敗。', 'error');
                    passwordInput.value = '';
                    return;
                }

                passwordInput.value = '';
                devices = data.devices;
                populateDeviceSelect(devices);
                loginForm.classList.add('hidden');
                deviceSection.classList.remove('hidden');
                sessionStatus.textContent = 'UNLOCKED';
                clearMessage();
                appendLog('已登入。');
                connectWebSocket();
            } catch (error) {
                appendLog('無法連線到伺服器。', 'error');
            } finally {
                submitPasswordBtn.disabled = false;
            }
        });

        wakeupButton.addEventListener('click', () => {
            const deviceId = deviceSelect.value;
            if (!deviceId) return;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendLog('WebSocket 尚未連線，正在重連。', 'error');
                connectWebSocket();
                return;
            }

            clearMessage();
            setJobRunning(true);
            socket.send(JSON.stringify({ type: 'wakeup', deviceId }));
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && sessionStatus.textContent === 'UNLOCKED') {
                connectWebSocket();
            }
        });

        window.addEventListener('online', () => {
            if (sessionStatus.textContent === 'UNLOCKED') {
                connectWebSocket();
            }
        });

        function connectWebSocket() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            intentionalClose = false;
            clearTimeout(reconnectTimer);
            updateSocketState('連線中', false);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                reconnectDelay = 1000;
                updateSocketState('已連線', true);
                appendLog('WebSocket 已連線。');
                if (activeJobId) {
                    socket.send(JSON.stringify({ type: 'resume', jobId: activeJobId }));
                }
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'job-started') {
                    activeJobId = data.jobId;
                    localStorage.setItem('wolActiveJobId', activeJobId);
                    setJobRunning(true);
                    return;
                }
                if (data.type === 'resume-miss') {
                    localStorage.removeItem('wolActiveJobId');
                    activeJobId = '';
                    setJobRunning(false);
                    return;
                }
                if (data.type === 'log') {
                    appendLog(data.message);
                    return;
                }
                if (data.type === 'done') {
                    appendLog(data.success ? '工作完成。' : '工作結束：裝置未確認醒來。', data.success ? 'success' : 'error');
                    localStorage.removeItem('wolActiveJobId');
                    activeJobId = '';
                    setJobRunning(false);
                }
            };

            socket.onclose = (event) => {
                updateSocketState('未連線', false);
                if (event.code === 1008) {
                    sessionStatus.textContent = 'LOCKED';
                    deviceSection.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    appendLog('登入狀態已失效，請重新登入。', 'error');
                    return;
                }
                if (!intentionalClose && sessionStatus.textContent === 'UNLOCKED') {
                    scheduleReconnect();
                }
            };

            socket.onerror = () => {
                updateSocketState('錯誤', false);
            };
        }

        function scheduleReconnect() {
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                appendLog('WebSocket 重新連線中。');
                connectWebSocket();
                reconnectDelay = Math.min(reconnectDelay * 1.7, 12000);
            }, reconnectDelay);
        }

        function populateDeviceSelect(deviceList) {
            deviceSelect.innerHTML = '<option value="">選擇一台裝置</option>';
            deviceList.forEach((device) => {
                const option = document.createElement('option');
                option.value = device.id;
                option.textContent = `${device.name} (${device.ip})`;
                deviceSelect.appendChild(option);
            });
        }

        function updateSocketState(label, connected) {
            socketLabel.textContent = label;
            socketStatusText.textContent = connected ? 'ONLINE' : 'OFFLINE';
            socketDot.classList.toggle('connected', connected);
        }

        function setJobRunning(running) {
            wakeupButton.disabled = running;
            wakeupButton.textContent = running ? '處理中' : '喚醒';
            jobStatus.textContent = running ? 'RUNNING' : 'IDLE';
            logState.textContent = running ? 'STREAMING' : 'READY';
        }

        function clearMessage() {
            messageDiv.innerHTML = '';
        }

        function appendLog(logMessage, tone = '') {
            const line = document.createElement('p');
            if (tone) line.className = tone;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${logMessage}`;
            messageDiv.appendChild(line);
            messageDiv.scrollTop = messageDiv.scrollHeight;
        }
    </script>
</body>
</html>
