<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠端喚醒控制台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-color: #dee2e6;
            --muted-color: #6c757d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin: 0 0 20px;
            font-weight: 600;
        }
        .status-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .status-row {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fdfdfd;
            text-align: center;
        }
        .status-row span {
            display: block;
            margin-bottom: 4px;
            color: var(--muted-color);
            font-size: 11px;
            font-weight: 700;
        }
        .status-row strong {
            font-size: 12px;
        }
        .connection {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--muted-color);
            font-size: 14px;
            font-weight: 600;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffc107;
        }
        .dot.connected {
            background: var(--success-color);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #a0a0a0;
            cursor: not-allowed;
        }
        .hidden {
            display: none;
        }
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            background-color: #f0f0f0;
            border: 1px solid var(--border-color);
            min-height: 50px;
            overflow-y: auto;
            max-height: 200px;
        }
        #message p {
            margin: 5px 0;
            padding: 0;
            white-space: pre-wrap;
        }
        #message p.success {
            color: var(--success-color);
        }
        #message p.error {
            color: var(--error-color);
        }
        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 12px;
            }
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.55rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>遠端喚醒服務</h1>

        <div class="connection" aria-live="polite">
            <span id="socket-dot" class="dot"></span>
            <span id="socket-label">未連線</span>
        </div>

        <div class="status-strip" aria-label="系統狀態">
            <div class="status-row">
                <span>SESSION</span>
                <strong id="session-status">LOCKED</strong>
            </div>
            <div class="status-row">
                <span>SOCKET</span>
                <strong id="socket-status-text">OFFLINE</strong>
            </div>
            <div class="status-row">
                <span>JOB</span>
                <strong id="job-status">IDLE</strong>
            </div>
        </div>

        <form id="login-form">
            <input type="text" name="username" autocomplete="username" class="hidden">
            <div class="form-group">
                <label for="password">請輸入密碼</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-password">驗證並載入裝置</button>
        </form>

        <div id="device-section" class="hidden">
            <div class="form-group">
                <label for="device-select">選擇裝置</label>
                <select id="device-select"></select>
            </div>
            <button id="wakeup-button" type="button">喚醒</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const deviceSection = document.getElementById('device-section');
        const passwordInput = document.getElementById('password');
        const submitPasswordBtn = document.getElementById('submit-password');
        const deviceSelect = document.getElementById('device-select');
        const wakeupButton = document.getElementById('wakeup-button');
        const messageDiv = document.getElementById('message');
        const socketDot = document.getElementById('socket-dot');
        const socketLabel = document.getElementById('socket-label');
        const socketStatusText = document.getElementById('socket-status-text');
        const sessionStatus = document.getElementById('session-status');
        const jobStatus = document.getElementById('job-status');
        const logState = document.getElementById('log-state');

        let devices = [];
        let socket = null;
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let intentionalClose = false;
        let activeJobId = localStorage.getItem('wolActiveJobId') || '';

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitPasswordBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput.value })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    appendLog(data.message || '登入失敗。', 'error');
                    passwordInput.value = '';
                    return;
                }

                passwordInput.value = '';
                devices = data.devices;
                populateDeviceSelect(devices);
                loginForm.classList.add('hidden');
                deviceSection.classList.remove('hidden');
                sessionStatus.textContent = 'UNLOCKED';
                clearMessage();
                appendLog('已登入。');
                connectWebSocket();
            } catch (error) {
                appendLog('無法連線到伺服器。', 'error');
            } finally {
                submitPasswordBtn.disabled = false;
            }
        });

        wakeupButton.addEventListener('click', () => {
            const deviceId = deviceSelect.value;
            if (!deviceId) return;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendLog('WebSocket 尚未連線，正在重連。', 'error');
                connectWebSocket();
                return;
            }

            clearMessage();
            setJobRunning(true);
            socket.send(JSON.stringify({ type: 'wakeup', deviceId }));
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && sessionStatus.textContent === 'UNLOCKED') {
                connectWebSocket();
            }
        });

        window.addEventListener('online', () => {
            if (sessionStatus.textContent === 'UNLOCKED') {
                connectWebSocket();
            }
        });

        function connectWebSocket() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            intentionalClose = false;
            clearTimeout(reconnectTimer);
            updateSocketState('連線中', false);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                reconnectDelay = 1000;
                updateSocketState('已連線', true);
                appendLog('WebSocket 已連線。');
                if (activeJobId) {
                    socket.send(JSON.stringify({ type: 'resume', jobId: activeJobId }));
                }
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'job-started') {
                    activeJobId = data.jobId;
                    localStorage.setItem('wolActiveJobId', activeJobId);
                    setJobRunning(true);
                    return;
                }
                if (data.type === 'resume-miss') {
                    localStorage.removeItem('wolActiveJobId');
                    activeJobId = '';
                    setJobRunning(false);
                    return;
                }
                if (data.type === 'log') {
                    appendLog(data.message);
                    return;
                }
                if (data.type === 'done') {
                    appendLog(data.success ? '工作完成。' : '工作結束：裝置未確認醒來。', data.success ? 'success' : 'error');
                    localStorage.removeItem('wolActiveJobId');
                    activeJobId = '';
                    setJobRunning(false);
                }
            };

            socket.onclose = (event) => {
                updateSocketState('未連線', false);
                if (event.code === 1008) {
                    sessionStatus.textContent = 'LOCKED';
                    deviceSection.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    const reason = event.reason || 'Unauthorized';
                    const message = reason === 'Invalid origin'
                        ? 'WebSocket 來源驗證失敗，請檢查反向代理 Host 設定。'
                        : '登入狀態已失效，請重新登入。';
                    appendLog(message, 'error');
                    return;
                }
                if (!intentionalClose && sessionStatus.textContent === 'UNLOCKED') {
                    scheduleReconnect();
                }
            };

            socket.onerror = () => {
                updateSocketState('錯誤', false);
            };
        }

        function scheduleReconnect() {
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                appendLog('WebSocket 重新連線中。');
                connectWebSocket();
                reconnectDelay = Math.min(reconnectDelay * 1.7, 12000);
            }, reconnectDelay);
        }

        function populateDeviceSelect(deviceList) {
            deviceSelect.innerHTML = '<option value="">選擇一台裝置</option>';
            deviceList.forEach((device) => {
                const option = document.createElement('option');
                option.value = device.id;
                option.textContent = `${device.name} (${device.ip})`;
                deviceSelect.appendChild(option);
            });
        }

        function updateSocketState(label, connected) {
            socketLabel.textContent = label;
            socketStatusText.textContent = connected ? 'ONLINE' : 'OFFLINE';
            socketDot.classList.toggle('connected', connected);
        }

        function setJobRunning(running) {
            wakeupButton.disabled = running;
            wakeupButton.textContent = running ? '處理中' : '喚醒';
            jobStatus.textContent = running ? 'RUNNING' : 'IDLE';
            logState.textContent = running ? 'STREAMING' : 'READY';
        }

        function clearMessage() {
            messageDiv.innerHTML = '';
        }

        function appendLog(logMessage, tone = '') {
            const line = document.createElement('p');
            if (tone) line.className = tone;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${logMessage}`;
            messageDiv.appendChild(line);
            messageDiv.scrollTop = messageDiv.scrollHeight;
        }
    </script>
</body>
</html>
