<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠端喚醒控制台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #17130f;
            --bg-soft: #211b15;
            --paper: #f1e8d8;
            --paper-deep: #e1d2bb;
            --ink: #241d18;
            --muted: #76695a;
            --line: rgba(36, 29, 24, 0.18);
            --line-dark: rgba(241, 232, 216, 0.16);
            --accent: #d66a31;
            --accent-strong: #b84e20;
            --copper: #a66a3f;
            --signal: #5f9b7a;
            --warn: #c9953a;
            --danger: #c84b3a;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                linear-gradient(120deg, rgba(214, 106, 49, 0.14), transparent 34%),
                linear-gradient(300deg, rgba(95, 155, 122, 0.14), transparent 40%),
                repeating-linear-gradient(105deg, transparent 0 18px, rgba(241, 232, 216, 0.035) 18px 19px),
                var(--bg);
            font-family: "Avenir Next", "Gill Sans", "Noto Sans TC", sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 18% 24%, rgba(241, 232, 216, 0.12) 0 1px, transparent 1px),
                radial-gradient(circle at 72% 68%, rgba(241, 232, 216, 0.08) 0 1px, transparent 1px);
            background-size: 34px 34px, 52px 52px;
            pointer-events: none;
        }

        main {
            width: min(1180px, calc(100% - 28px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(250px, 0.82fr) minmax(360px, 1.18fr);
            align-items: center;
            gap: 18px;
            padding: 28px 0;
            position: relative;
            z-index: 1;
        }

        .mast,
        .workspace {
            border: 1px solid var(--line-dark);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .mast {
            min-height: 620px;
            padding: 26px;
            color: var(--paper);
            background:
                linear-gradient(160deg, rgba(214, 106, 49, 0.2), transparent 42%),
                linear-gradient(20deg, rgba(95, 155, 122, 0.16), transparent 46%),
                var(--bg-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .mast::after {
            content: "";
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(241, 232, 216, 0.13);
            border-radius: 8px;
            pointer-events: none;
        }

        .brand-mark {
            width: 68px;
            height: 68px;
            border: 1px solid rgba(241, 232, 216, 0.32);
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 28px;
            background:
                radial-gradient(circle, rgba(214, 106, 49, 0.86) 0 6px, transparent 7px),
                conic-gradient(from 25deg, rgba(241, 232, 216, 0.08), rgba(241, 232, 216, 0.4), rgba(241, 232, 216, 0.08));
        }

        .brand-mark::before {
            content: "";
            width: 32px;
            height: 32px;
            border: 2px solid var(--paper);
            border-top-color: transparent;
            border-radius: 50%;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #eebf8b;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            max-width: 8ch;
            font-family: Georgia, "Noto Serif TC", serif;
            font-size: clamp(3rem, 6vw, 5.65rem);
            font-weight: 700;
            line-height: 0.92;
            letter-spacing: 0;
        }

        .mast-copy {
            width: min(100%, 300px);
            margin: 24px 0 0;
            color: rgba(241, 232, 216, 0.72);
            font-size: 0.98rem;
            line-height: 1.8;
        }

        .status-strip {
            display: grid;
            gap: 9px;
            position: relative;
            z-index: 1;
        }

        .status-row {
            min-height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 0 15px;
            border: 1px solid rgba(241, 232, 216, 0.14);
            border-radius: 8px;
            background: rgba(13, 11, 9, 0.22);
            font-size: 0.92rem;
        }

        .status-row span:first-child {
            color: rgba(241, 232, 216, 0.56);
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .status-row strong {
            color: var(--paper);
            font-size: 0.84rem;
            letter-spacing: 0.04em;
        }

        .workspace {
            min-height: 620px;
            padding: 22px;
            background:
                linear-gradient(180deg, rgba(255, 252, 244, 0.82), rgba(225, 210, 187, 0.9)),
                var(--paper);
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 18px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 10px 0 18px;
            border-bottom: 1px solid var(--line);
        }

        .toolbar-title {
            font-family: Georgia, "Noto Serif TC", serif;
            font-size: clamp(1.5rem, 3vw, 2.15rem);
            font-weight: 700;
        }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 250, 240, 0.72);
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--warn);
            box-shadow: 0 0 0 5px rgba(201, 149, 58, 0.16);
        }

        .dot.connected {
            background: var(--signal);
            box-shadow: 0 0 0 5px rgba(95, 155, 122, 0.18);
        }

        form,
        .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background:
                linear-gradient(135deg, rgba(255, 250, 240, 0.78), rgba(232, 220, 200, 0.72));
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        input,
        select,
        button {
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font: inherit;
        }

        input,
        select {
            width: 100%;
            padding: 0 14px;
            color: var(--ink);
            background: rgba(255, 252, 244, 0.86);
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgba(214, 106, 49, 0.78);
            box-shadow: 0 0 0 4px rgba(214, 106, 49, 0.12);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 126px;
            padding: 0 18px;
            color: #fff7eb;
            background: var(--accent);
            border-color: transparent;
            box-shadow: 0 14px 28px rgba(184, 78, 32, 0.26);
            font-weight: 900;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-strong);
            transform: translateY(-1px);
            box-shadow: 0 17px 32px rgba(184, 78, 32, 0.3);
        }

        button:disabled {
            cursor: not-allowed;
            background: #9a8f80;
            box-shadow: none;
        }

        .hidden {
            display: none;
        }

        .console {
            min-height: 310px;
            border: 1px solid rgba(36, 29, 24, 0.22);
            border-radius: 8px;
            background:
                linear-gradient(180deg, rgba(24, 21, 18, 0.96), rgba(15, 14, 12, 0.98)),
                #12100e;
            color: #efe4d2;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        .console-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-bottom: 1px solid rgba(239, 228, 210, 0.15);
            color: #eebf8b;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
        }

        #message {
            margin: 0;
            padding: 16px;
            overflow-y: auto;
            max-height: 374px;
            min-height: 270px;
            font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        #message p {
            margin: 0 0 8px;
            white-space: pre-wrap;
        }

        #message p.error {
            color: #ff9a8c;
        }

        #message p.success {
            color: #9dd9b6;
        }

        @media (max-width: 820px) {
            main {
                grid-template-columns: 1fr;
                align-items: start;
                padding: 14px 0;
            }

            .mast,
            .workspace {
                min-height: auto;
            }

            .mast {
                padding: 22px;
            }

            .mast-copy {
                max-width: none;
            }
        }

        @media (max-width: 560px) {
            main {
                width: min(100% - 18px, 1180px);
            }

            .toolbar,
            form,
            .controls {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: start;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="mast" aria-label="遠端喚醒">
            <div>
                <div class="brand-mark" aria-hidden="true"></div>
                <p class="eyebrow">Wake-on-LAN</p>
                <h1>遠端喚醒控制台</h1>
                <p class="mast-copy">家裡的機器不用一直醒著。連線、登入、送出喚醒，讓主機在需要時回到線上。</p>
            </div>
            <div class="status-strip">
                <div class="status-row">
                    <span>SESSION</span>
                    <strong id="session-status">LOCKED</strong>
                </div>
                <div class="status-row">
                    <span>SOCKET</span>
                    <strong id="socket-status-text">OFFLINE</strong>
                </div>
                <div class="status-row">
                    <span>JOB</span>
                    <strong id="job-status">IDLE</strong>
                </div>
            </div>
        </section>

        <section class="workspace" aria-label="控制面板">
            <div class="toolbar">
                <div class="toolbar-title">控制面板</div>
                <div class="connection" aria-live="polite">
                    <span id="socket-dot" class="dot"></span>
                    <span id="socket-label">未連線</span>
                </div>
            </div>

            <form id="login-form">
                <input type="text" name="username" autocomplete="username" class="hidden">
                <div class="field">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="submit-password">登入</button>
            </form>

            <div id="device-section" class="controls hidden">
                <div class="field">
                    <label for="device-select">裝置</label>
                    <select id="device-select"></select>
                </div>
                <button id="wakeup-button" type="button">喚醒</button>
            </div>

            <div class="console" aria-live="polite">
                <div class="console-head">
                    <span>EVENT LOG</span>
                    <span id="log-state">READY</span>
                </div>
                <div id="message"></div>
            </div>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const deviceSection = document.getElementById('device-section');
        const passwordInput = document.getElementById('password');
        const submitPasswordBtn = document.getElementById('submit-password');
        const deviceSelect = document.getElementById('device-select');
        const wakeupButton = document.getElementById('wakeup-button');
        const messageDiv = document.getElementById('message');
        const socketDot = document.getElementById('socket-dot');
        const socketLabel = document.getElementById('socket-label');
        const socketStatusText = document.getElementById('socket-status-text');
        const sessionStatus = document.getElementById('session-status');
        const jobStatus = document.getElementById('job-status');
        const logState = document.getElementById('log-state');

        let devices = [];
        let socket = null;
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let intentionalClose = false;
        let activeJobId = localStorage.getItem('wolActiveJobId') || '';

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitPasswordBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput.value })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    appendLog(data.message || '登入失敗。', 'error');
                    passwordInput.value = '';
                    return;
                }

                passwordInput.value = '';
                devices = data.devices;
                populateDeviceSelect(devices);
                loginForm.classList.add('hidden');
                deviceSection.classList.remove('hidden');
                sessionStatus.textContent = 'UNLOCKED';
                clearMessage();
                appendLog('已登入。');
                connectWebSocket();
            } catch (error) {
                appendLog('無法連線到伺服器。', 'error');
            } finally {
                submitPasswordBtn.disabled = false;
            }
        });

        wakeupButton.addEventListener('click', () => {
            const deviceId = deviceSelect.value;
            if (!deviceId) return;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendLog('WebSocket 尚未連線，正在重連。', 'error');
                connectWebSocket();
                return;
            }

            clearMessage();
            setJobRunning(true);
            socket.send(JSON.stringify({ type: 'wakeup', deviceId }));
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && sessionStatus.textContent === 'UNLOCKED') {
                connectWebSocket();
            }
        });

        window.addEventListener('online', () => {
            if (sessionStatus.textContent === 'UNLOCKED') {
                connectWebSocket();
            }
        });

        function connectWebSocket() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            intentionalClose = false;
            clearTimeout(reconnectTimer);
            updateSocketState('連線中', false);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                reconnectDelay = 1000;
                updateSocketState('已連線', true);
                appendLog('WebSocket 已連線。');
                if (activeJobId) {
                    socket.send(JSON.stringify({ type: 'resume', jobId: activeJobId }));
                }
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'job-started') {
                    activeJobId = data.jobId;
                    localStorage.setItem('wolActiveJobId', activeJobId);
                    setJobRunning(true);
                    return;
                }
                if (data.type === 'resume-miss') {
                    localStorage.removeItem('wolActiveJobId');
                    activeJobId = '';
                    setJobRunning(false);
                    return;
                }
                if (data.type === 'log') {
                    appendLog(data.message);
                    return;
                }
                if (data.type === 'done') {
                    appendLog(data.success ? '工作完成。' : '工作結束：裝置未確認醒來。', data.success ? 'success' : 'error');
                    localStorage.removeItem('wolActiveJobId');
                    activeJobId = '';
                    setJobRunning(false);
                }
            };

            socket.onclose = (event) => {
                updateSocketState('未連線', false);
                if (event.code === 1008) {
                    sessionStatus.textContent = 'LOCKED';
                    deviceSection.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    const reason = event.reason || 'Unauthorized';
                    const message = reason === 'Invalid origin'
                        ? 'WebSocket 來源驗證失敗，請檢查反向代理 Host 設定。'
                        : '登入狀態已失效，請重新登入。';
                    appendLog(message, 'error');
                    return;
                }
                if (!intentionalClose && sessionStatus.textContent === 'UNLOCKED') {
                    scheduleReconnect();
                }
            };

            socket.onerror = () => {
                updateSocketState('錯誤', false);
            };
        }

        function scheduleReconnect() {
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                appendLog('WebSocket 重新連線中。');
                connectWebSocket();
                reconnectDelay = Math.min(reconnectDelay * 1.7, 12000);
            }, reconnectDelay);
        }

        function populateDeviceSelect(deviceList) {
            deviceSelect.innerHTML = '<option value="">選擇一台裝置</option>';
            deviceList.forEach((device) => {
                const option = document.createElement('option');
                option.value = device.id;
                option.textContent = `${device.name} (${device.ip})`;
                deviceSelect.appendChild(option);
            });
        }

        function updateSocketState(label, connected) {
            socketLabel.textContent = label;
            socketStatusText.textContent = connected ? 'ONLINE' : 'OFFLINE';
            socketDot.classList.toggle('connected', connected);
        }

        function setJobRunning(running) {
            wakeupButton.disabled = running;
            wakeupButton.textContent = running ? '處理中' : '喚醒';
            jobStatus.textContent = running ? 'RUNNING' : 'IDLE';
            logState.textContent = running ? 'STREAMING' : 'READY';
        }

        function clearMessage() {
            messageDiv.innerHTML = '';
        }

        function appendLog(logMessage, tone = '') {
            const line = document.createElement('p');
            if (tone) line.className = tone;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${logMessage}`;
            messageDiv.appendChild(line);
            messageDiv.scrollTop = messageDiv.scrollHeight;
        }
    </script>
</body>
</html>
